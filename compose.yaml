name: jingshan

services:
  web:
    build: .
    image: jingshan-web:v3
    init: true
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8080}:3000"
    environment:
      APP_USER: "${APP_USER:-admin}"
      APP_PASSWORD: "${APP_PASSWORD:?Set APP_PASSWORD in docker.env}"
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: jingshan
      PGUSER: jingshan
      PGPASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in docker.env}"
      CIM_SERVICE_ORIGIN: "${CIM_SERVICE_ORIGIN:-}"
      CIM_FEATURE_ORIGINS: "${CIM_FEATURE_ORIGINS:-}"
      CIM_TLS_ORIGIN: "${CIM_TLS_ORIGIN:-}"
      CIM_TLS_SHA256: "${CIM_TLS_SHA256:-}"
      TZ: "${TZ:-Asia/Shanghai}"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  db:
    image: postgres:18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: jingshan
      POSTGRES_USER: jingshan
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in docker.env}"
      TZ: "${TZ:-Asia/Shanghai}"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "jingshan", "-d", "jingshan"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

volumes:
  postgres_data:
